name: build and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        platform: [ "linux/amd64", "linux/arm64" ]
        profile: [ "build-image", "build-image-native", "build-image-native-keycloak" ]
    steps:
      - uses: actions/checkout@v7
      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v5
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ format('ghcr.io/{0}{1}', github.repository, matrix.profile == 'build-image-native' && '-native' || matrix.profile == 'build-image-native-keycloak' && '-native-keycloak' || '') }}
          tags: |
            type=sha
            type=ref,event=branch
      - name: Build with Maven
        env:
          IMAGE_NAME: ${{ format('ghcr.io/{0}{1}', github.repository, matrix.profile == 'build-image-native' && '-native' || matrix.profile == 'build-image-native-keycloak' && '-native-keycloak' || '') }}
          IMAGE_RAW_TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          export IMAGE_TAGS="${IMAGE_RAW_TAGS//$'\n'/,}"
          mvn -B -ntp -P ci,${{ matrix.profile }}${{ contains(matrix.profile, 'native') && ',native' || '' }}${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && ',publish' || '' }} package
