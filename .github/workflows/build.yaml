name: build and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        profile: [ "build-image", "build-image-native", "build-image-native-keycloak" ]
    steps:
      - uses: actions/checkout@v7
      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v5
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ format('ghcr.io/{0}{1}', github.repository, matrix.profile == 'build-image-native' && '-native' || matrix.profile == 'build-image-native-keycloak' && '-native-keycloak' || '') }}
          tags: |
            type=sha,suffix=-amd64
            type=ref,event=branch,suffix=-amd64
      - name: Build with Maven
        env:
          IMAGE_NAME: ${{ format('ghcr.io/{0}{1}', github.repository, matrix.profile == 'build-image-native' && '-native' || matrix.profile == 'build-image-native-keycloak' && '-native-keycloak' || '') }}
          IMAGE_RAW_TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_BUILD_PLATFORM: "linux/amd64"
        run: |
          export IMAGE_TAGS="${IMAGE_RAW_TAGS//$'\n'/,}"
          mvn -B -ntp -P ci,${{ matrix.profile }}${{ contains(matrix.profile, 'native') && ',native,nativeTest' || '' }}${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && ',publish' || '' }} package

  build-arm64:
    runs-on: ubuntu-26.04-arm
    permissions:
      packages: write
    strategy:
      matrix:
        profile: [ "build-image", "build-image-native", "build-image-native-keycloak" ]
    steps:
      - uses: actions/checkout@v7
      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v5
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ format('ghcr.io/{0}{1}', github.repository, matrix.profile == 'build-image-native' && '-native' || matrix.profile == 'build-image-native-keycloak' && '-native-keycloak' || '') }}
          tags: |
            type=sha,suffix=-arm64
            type=ref,event=branch,suffix=-arm64
      - name: Build with Maven
        env:
          IMAGE_NAME: ${{ format('ghcr.io/{0}{1}', github.repository, matrix.profile == 'build-image-native' && '-native' || matrix.profile == 'build-image-native-keycloak' && '-native-keycloak' || '') }}
          IMAGE_RAW_TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_BUILD_PLATFORM: "linux/arm64"
        run: |
          export IMAGE_TAGS="${IMAGE_RAW_TAGS//$'\n'/,}"
          mvn -B -ntp -P ci,${{ matrix.profile }}${{ contains(matrix.profile, 'native') && ',native,nativeTest' || '' }}${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && ',publish' || '' }} package

  merge-multiarch-manifests:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - build-amd64
      - build-arm64
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        profile: ["build-image", "build-image-native", "build-image-native-keycloak"]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-architecture manifests
        env:
          IMAGE_NAME: ${{ format('ghcr.io/{0}{1}', github.repository, matrix.profile == 'build-image-native' && '-native' || matrix.profile == 'build-image-native-keycloak' && '-native-keycloak' || '') }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          SHORT_SHA="${SHORT_SHA:0:7}"

          # Merge the architecture-specific commit tags.
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:sha-${SHORT_SHA}" \
            "${IMAGE_NAME}:sha-${SHORT_SHA}-amd64" \
            "${IMAGE_NAME}:sha-${SHORT_SHA}-arm64"

          # Merge the architecture-specific main branch tags.
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:main" \
            "${IMAGE_NAME}:main-amd64" \
            "${IMAGE_NAME}:main-arm64"