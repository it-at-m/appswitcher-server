name: release

# Run workflow on commits to the `main` branch
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to release from ?"
        required: true
        default: "main"
      release-version:
        description: "Release version ?"
        required: true
      release-tag:
        description: "Release tag ?"
        required: true
      development-version:
        description: "Development version ?"
        required: true
      latest-image:
        description: "Tag image as 'latest' (y/n) ?"
        required: true
        default: "y"

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: Setup git user
        uses: fregante/setup-git-user@v2
      - name: Install Java and Maven
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Perform maven release
        run: >
          mvn -B -ntp release:prepare 
          -DreleaseVersion=${{ github.event.inputs.release-version }} 
          -DdevelopmentVersion=${{ github.event.inputs.development-version }} 
          -Dtag=${{ github.event.inputs.release-tag }} 
          -Darguments="-DskipTests"

  publish-image-amd64:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        profile: [ "build-image", "build-image-native", "build-image-native-keycloak" ]
    steps:
      - name: checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release-tag }}
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ format('ghcr.io/{0}{1}', github.repository, matrix.profile == 'build-image-native' && '-native' || matrix.profile == 'build-image-native-keycloak' && '-native-keycloak' || '') }}
          tags: |
            type=raw,value=${{ github.event.inputs.release-version }}-amd64
            type=raw,value=latest-amd64,enable=${{ github.event.inputs.latest-image == 'y' }}
      - name: Build image
        env:
          IMAGE_NAME: ${{ format('ghcr.io/{0}{1}', github.repository, matrix.profile == 'build-image-native' && '-native' || matrix.profile == 'build-image-native-keycloak' && '-native-keycloak' || '') }}
          IMAGE_RAW_TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_BUILD_PLATFORM: "linux/amd64"
        run: |
          export IMAGE_TAGS="${IMAGE_RAW_TAGS//$'\n'/,}"
          mvn -B -ntp -DskipTests -P ci,publish,${{ matrix.profile }}${{ contains(matrix.profile, 'native') && ',native' || '' }} package

  publish-image-arm64:
    needs: prepare-release
    runs-on: ubuntu-26.04-arm
    permissions:
      packages: write
    strategy:
      matrix:
        profile: [ "build-image", "build-image-native", "build-image-native-keycloak" ]
    steps:
      - name: checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release-tag }}
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ format('ghcr.io/{0}{1}', github.repository, matrix.profile == 'build-image-native' && '-native' || matrix.profile == 'build-image-native-keycloak' && '-native-keycloak' || '') }}
          tags: |
            type=raw,value=${{ github.event.inputs.release-version }}-arm64
            type=raw,value=latest-arm64,enable=${{ github.event.inputs.latest-image == 'y' }}
      - name: Build image
        env:
          IMAGE_NAME: ${{ format('ghcr.io/{0}{1}', github.repository, matrix.profile == 'build-image-native' && '-native' || matrix.profile == 'build-image-native-keycloak' && '-native-keycloak' || '') }}
          IMAGE_RAW_TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_BUILD_PLATFORM: "linux/arm64"
        run: |
          export IMAGE_TAGS="${IMAGE_RAW_TAGS//$'\n'/,}"
          mvn -B -ntp -DskipTests -P ci,publish,${{ matrix.profile }}${{ contains(matrix.profile, 'native') && ',native' || '' }} package


  merge-multiarch-manifests:
    needs:
      - publish-image-amd64
      - publish-image-arm64
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        profile: [ "build-image", "build-image-native", "build-image-native-keycloak" ]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifests
        env:
          IMAGE_NAME: ${{ format('ghcr.io/{0}{1}', github.repository, matrix.profile == 'build-image-native' && '-native' || matrix.profile == 'build-image-native-keycloak' && '-native-keycloak' || '') }}
          RELEASE_VERSION: ${{ github.event.inputs.release-version }}
          LATEST_IMAGE: ${{ github.event.inputs.latest-image }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${RELEASE_VERSION}" \
            "${IMAGE_NAME}:${RELEASE_VERSION}-amd64" \
            "${IMAGE_NAME}:${RELEASE_VERSION}-arm64"

          if [ "$LATEST_IMAGE" = "y" ]; then
            docker buildx imagetools create \
              --tag "${IMAGE_NAME}:latest" \
              "${IMAGE_NAME}:latest-amd64" \
              "${IMAGE_NAME}:latest-arm64"
          fi

  github-release:
    needs:
      - merge-multiarch-manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release-tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
